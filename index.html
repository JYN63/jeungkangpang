<h1 class="seo">증강팡 (Augment Pop)</h1><p class="seo">증강팡은 애니팡처럼 같은 색 타일을 맞춰 터뜨리고, 증강을 골라 더 멀리 가는 무료 매치-3 퍼즐 게임이에요. 1분 모드, 무한 모드, 한옥 테마와 국악 배경음악까지. 설치 없이 휴대폰 브라우저에서 바로 즐기세요.</p>
<noscript><h1>증강팡</h1><p>증강팡은 애니팡처럼 같은 색 타일을 맞춰 터뜨리고, 증강을 골라 더 멀리 가는 무료 매치-3 퍼즐 게임이에요. 1분 모드, 무한 모드, 한옥 테마와 국악 배경음악까지. 설치 없이 휴대폰 브라우저에서 바로 즐기세요.</p><p>자바스크립트를 켜야 게임을 할 수 있어요.</p></noscript>

/* Layout: 동화책 한 장 — 하늘·구름·언덕 풍경 위에 HUD, 크림색 보드, 신명 게이지, 기술·증강 줄 */
:root{

  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --dw:400;
  color-scheme:light;
}
:root[data-lang="en"],:root[data-lang="it"]{--display:"Fredoka","Nunito","Arial Rounded MT Bold",sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;--dw:600}
:root[data-lang="ja"]{--display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;--body:"M PLUS Rounded 1c","Hiragino Sans","Yu Gothic",sans-serif;--dw:800}
:root[data-lang="zh"]{--display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;--body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--dw:400}
:root[data-lang="ja"] body{font-weight:500}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 48%,var(--sky3) 100%) fixed var(--sky3);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.scene svg{position:absolute;left:50%;bottom:0;width:max(100%,900px);height:100%;transform:translateX(-50%)}
.cloud{animation:drift linear infinite}
.cloud.c1{animation-duration:70s}.cloud.c2{animation-duration:95s;animation-delay:-40s}.cloud.c3{animation-duration:120s;animation-delay:-80s}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1160px)}}
.twinkle{animation:twinkle 2.6s ease-in-out infinite}
.twinkle:nth-of-type(2n){animation-delay:-1.3s}
@keyframes twinkle{50%{opacity:.25}}
.app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding-inline:16px;padding-block:10px 28px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
b,.num{font-variant-numeric:tabular-nums}
.ic{display:block;width:100%;height:100%}

.hud{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:20px;background:rgba(255,250,240,.82);box-shadow:0 4px 0 rgba(226,185,138,.55)}

.stage{white-space:nowrap}

.stage .lbl{font-family:var(--display);font-size:15px;color:var(--ink)}
.augnext{font-size:11px;line-height:1.25;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.scorebox{flex:0 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-end;column-gap:5px;row-gap:0;text-align:right}

.scorebox b{font-family:var(--display);font-weight:var(--dw);font-size:30px;line-height:1}
.icon-btn{width:38px;height:38px;border-radius:12px;border:2px solid var(--rim);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;font:var(--dw) 18px var(--display)}
.icon-btn svg{width:20px;height:20px}

.meter{position:relative;height:9px;border-radius:99px;background:var(--paper2);box-shadow:inset 0 0 0 1.5px var(--rim);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:var(--gold);transition:width .15s linear}

.timerow{display:flex;align-items:center;gap:10px}

.toast{white-space:pre-line}

.coach{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:18px;background:var(--paper);box-shadow:0 0 0 3px var(--gold),0 4px 0 3px rgba(226,185,138,.6)}
.coach-top{display:flex;align-items:center;justify-content:space-between}

.board-wrap{position:relative;padding:8px;border-radius:24px;background:#f6d8ae;box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--wood),0 14px 28px rgba(140,90,50,.28);transition:box-shadow .3s}

canvas{display:block;width:100%;touch-action:none;border-radius:16px}
.combo{--cc:var(--verm);position:absolute;left:0;right:0;top:-10px;text-align:center;font-family:var(--display);font-size:26px;color:var(--cc);text-shadow:0 2px 0 #fff,0 -1px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 4px 8px rgba(140,90,50,.3);pointer-events:none;opacity:0}
.combo.bump{animation:combo 1.1s ease-out forwards}
@keyframes combo{0%{opacity:0;transform:scale(.5) rotate(-6deg)}15%{opacity:1;transform:scale(1.2) rotate(2deg)}30%{transform:scale(1) rotate(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);width:max-content;max-width:calc(100% - 32px);padding:10px 18px;border-radius:16px;background:var(--shade);box-shadow:0 0 0 2px var(--rim),0 6px 16px rgba(140,90,50,.2);font-size:15px;line-height:1.45;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner{position:absolute;inset:8px;border-radius:16px;display:grid;place-content:center;text-align:center;gap:8px;background:rgba(255,250,240,.88);pointer-events:none}
.banner strong{font-family:var(--display);font-weight:var(--dw);font-size:54px;color:var(--verm);text-shadow:0 4px 0 #ffd9a8;animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
.banner span{animation:rise .4s .25s ease-out backwards}
.banner em{font-style:normal;color:var(--gold);font-family:var(--display);font-size:16px;animation:rise .4s .45s ease-out backwards}
@keyframes stamp{from{transform:scale(2.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

.fever{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:rgba(255,250,240,.82)}
.fever .meter{flex:1;height:11px}
.fever .meter i{background:linear-gradient(90deg,var(--berry),var(--gold))}
.fever.on .meter i{background:linear-gradient(90deg,var(--gold),#fff3c2,var(--gold));background-size:200% 100%;animation:shine .6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.termlink{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:2px 0;font:var(--dw) 15px var(--display);color:var(--ink);cursor:pointer}
.termlink i,.term i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--gold);color:#fff;font:var(--dw) 12px var(--display);font-style:normal}

.skills{display:flex;gap:8px;flex-wrap:wrap}

.skill{flex:1 1 140px;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:16px;border:2px solid var(--rim);background:var(--paper);color:var(--ink);font:var(--dw) 16px var(--display);cursor:pointer;transition:transform .12s;box-shadow:0 3px 0 var(--rim)}
.skill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--rim)}
.skill b{margin-left:auto;font-family:var(--display);font-weight:var(--dw);font-size:19px;color:var(--verm)}
.skill.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,169,59,.35)}
.skill.nudge{border-color:var(--verm);animation:nudge 1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0);box-shadow:0 3px 0 var(--rim),0 0 0 0 rgba(232,102,79,.5)}50%{transform:translateY(-3px);box-shadow:0 6px 0 var(--rim),0 0 0 6px rgba(232,102,79,.25)}}
.skill:disabled{opacity:.45}
.ico{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:14px;background:var(--paper2);padding:3px}
.ico.sm{width:32px;height:32px;border-radius:10px;padding:2px}
.t1 .ico,.ico.t1{background:#fff0c9}
.t2 .ico,.ico.t2{background:linear-gradient(135deg,#dbeaff,#f1e3ff,#ffe1e6,#fff1cc)}

.augs{display:flex;flex-wrap:wrap;gap:6px}
.augs .empty{margin:0;font-size:13px;color:var(--ink);line-height:1.5;padding:8px 12px;border-radius:14px;background:rgba(255,250,240,.75)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:12px;border:2px solid var(--rim);background:var(--paper);color:var(--ink);font:var(--dw) 14px var(--display);cursor:pointer}
.chip .ico{width:28px;height:28px;border-radius:8px;padding:1px}
.chip.t1{border-color:#f5cf86}
.chip.t2{border-color:#d7c3f5}

.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(232,102,79,.3));opacity:0;transition:opacity .4s;z-index:5}
@keyframes pulse{50%{opacity:.45}}

.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));background:rgba(120,80,50,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow-y:auto}
.sheet{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;padding:22px 20px;border-radius:26px;background:var(--paper);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--wood),0 20px 40px rgba(120,70,40,.3);animation:sheet .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes sheet{from{opacity:0;transform:translateY(16px) scale(.97)}}
.eyebrow{margin:0;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.sheet h1{margin:0;font-family:var(--display);font-weight:var(--dw);font-size:68px;line-height:1;color:var(--verm);text-shadow:0 5px 0 #ffd9a8;letter-spacing:.02em}
.sheet h2{margin:0;font-family:var(--display);font-weight:var(--dw);font-size:28px;line-height:1.2;text-wrap:balance}
.swatches{display:flex;gap:4px}
.swatches img{width:40px;height:40px;animation:bob 1.6s ease-in-out infinite}
.swatches img:nth-child(2){animation-delay:.12s}.swatches img:nth-child(3){animation-delay:.24s}.swatches img:nth-child(4){animation-delay:.36s}.swatches img:nth-child(5){animation-delay:.48s}.swatches img:nth-child(6){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-6px)}}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.55}
.rules li::marker{color:var(--verm)}
.rules b{font-family:var(--display);font-weight:var(--dw);color:var(--verm)}
.best{margin:0;font-size:13px;color:var(--muted)}
.primary,.ghost{min-height:50px;border-radius:16px;font:var(--dw) 18px var(--display);letter-spacing:.03em;cursor:pointer;transition:transform .12s,box-shadow .12s}
.primary{border:0;background:var(--gold);color:#fff;text-shadow:0 1px 0 #c7801f;box-shadow:0 5px 0 #c7801f}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #c7801f}
.ghost{border:2px solid var(--rim);background:#fff;color:var(--ink);font-size:16px;box-shadow:0 4px 0 var(--rim)}
.ghost:active{transform:translateY(2px);box-shadow:0 2px 0 var(--rim)}

.btnrow{display:flex;flex-direction:column;gap:10px}
.btnrow.two,.btnrow.three{flex-direction:row}

.cards{display:flex;flex-direction:column;gap:10px;perspective:800px}

.stats{margin:0;display:grid;grid-template-columns:1fr 1.3fr 1.15fr;gap:8px}
.stats div{padding:10px;border-radius:14px;background:var(--paper2);min-width:0}
.stats dt{font-size:11px;line-height:1.3;color:var(--muted);overflow-wrap:anywhere;hyphens:auto}
.stats dd.long{font-size:15px}
.stats dd{margin:4px 0 0;font-family:var(--display);font-size:clamp(16px,5.2vw,21px);font-variant-numeric:tabular-nums;white-space:nowrap}
.newrec{color:var(--verm);font-family:var(--display);font-size:16px;margin:0}

.submit{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--paper2)}
.submit label{font-size:12px;color:var(--muted)}
.submit .row{display:flex;gap:8px}
.submit input{flex:1;min-width:0;height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--rim);background:#fff;color:var(--ink);font:16px var(--body)}
.submit input:focus{outline:2px solid var(--gold);outline-offset:1px}
.submit button{height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--gold);color:#fff;font:var(--dw) 16px var(--display);cursor:pointer;flex:none;box-shadow:0 3px 0 #c7801f}
.submit p{margin:0;font-size:13px;color:var(--muted)}
.submit p.ok{color:var(--jade)}
.submit p.err{color:var(--verm)}

.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--paper2)}
.tab{flex:1;height:38px;border:0;border-radius:11px;background:transparent;color:var(--muted);font:var(--dw) 16px var(--display);cursor:pointer}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--rim)}
.ranks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:min(52vh,420px);overflow-y:auto}
.rk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--paper2);animation:rise .3s ease-out backwards}
.rk.me{box-shadow:inset 0 0 0 2px var(--gold)}
.rk .pos{width:28px;font-family:var(--display);font-size:20px;color:var(--muted);text-align:center;flex:none}
.rk:nth-child(1) .pos{color:var(--gold)}.rk:nth-child(2) .pos{color:var(--silver)}.rk:nth-child(3) .pos{color:var(--bronze)}
.rk .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rk .who b{font-weight:var(--dw);font-family:var(--display);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .who small{display:flex;gap:2px;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap}
.rk .who small .ic{width:18px;height:18px;flex:none}
.rk .res{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.rk .res b{font-family:var(--display);font-weight:var(--dw);font-size:18px}
.rk .res small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ranks .note{padding:14px;border-radius:14px;background:var(--paper2);font-size:14px;line-height:1.5;color:var(--muted)}

.gloss{display:flex;flex-direction:column;gap:8px;max-height:min(56vh,460px);overflow-y:auto;padding-right:2px}
.gl{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:var(--paper2)}
.gl .ico{background:#fff;width:46px;height:46px}
.gl b{display:block;font-family:var(--display);font-weight:var(--dw);font-size:18px}
.gl p{margin:2px 0 0;font-size:14px;line-height:1.5}
.ico img{width:100%;height:100%;display:block}

.pop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(120,80,50,.3)}
.pop-card{position:relative;width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 20px 20px;border-radius:26px;background:#fff;text-align:center;box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--gold),0 20px 40px rgba(120,70,40,.3);animation:popin .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes popin{from{opacity:0;transform:scale(.8)}}
.pop-card .ico{width:84px;height:84px;border-radius:24px;margin-top:-62px;box-shadow:0 0 0 4px #fff,0 6px 14px rgba(120,70,40,.2);animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
.pop-kind{margin:4px 0 0;font-size:12px;letter-spacing:.1em;color:var(--muted)}
.pop-card h3{margin:0;font-family:var(--display);font-weight:var(--dw);font-size:26px}
.pop-card p.txt{margin:0;font-size:15px;line-height:1.6;text-wrap:pretty;overflow-wrap:anywhere}
:root[data-lang="zh"] .pop-card p.txt,:root[data-lang="ja"] .pop-card p.txt{text-wrap:wrap;line-break:auto}
.pop-terms{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pop-terms:empty{display:none}
.pop-card .primary{width:100%;margin-top:6px}
/* 등급 색 */
.card.t0{background:linear-gradient(160deg,#f7f9fd,#dde4f0);border-color:#9fadc6;box-shadow:0 4px 0 #c3cde0}
.card.t1{background:linear-gradient(160deg,#fff8dc,#ffdc85);border-color:#e99e33;box-shadow:0 4px 0 #e6b45c}
.card.t2{border-color:transparent;background:linear-gradient(160deg,#e1efff,#f1e4ff 40%,#ffe4ee 72%,#fff1cc) padding-box,linear-gradient(120deg,#6fb2ff,#b48cff,#ff86a6,#ffc94d,#6fb2ff) border-box;background-size:100% 100%,300% 100%;box-shadow:0 4px 0 #d6c3f2}
.card .ico{background:#fff;box-shadow:0 2px 0 rgba(90,58,42,.12)}
.tierrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ct .tier{display:inline-block;padding:1px 9px;border-radius:99px;font:var(--dw) 12px var(--display);letter-spacing:.04em;color:#fff}
.t0 .tier{background:#8795b1}.t1 .tier{background:#df8f1b}.t2 .tier{background:linear-gradient(90deg,#5aa6ff,#a77bff,#ff7a9c)}.t3 .tier{background:linear-gradient(90deg,#ff5f8a,#ff9f43)}
.card.t1 .tier,.card.t2 .tier{color:#fff}
.lvup{font:var(--dw) 13px var(--display);color:#fff;background:var(--jade);padding:1px 9px;border-radius:99px}
.lvinfo{font-size:12px;color:var(--ink);opacity:.75}
.fusehint{display:block;margin-top:3px;font-size:12px;line-height:1.5;color:#8a4fd6}
.ct .fusehint b{font-weight:var(--dw);font-family:var(--display);font-size:13px}
.ico.mini{display:inline-block;vertical-align:-4px;width:18px;height:18px;padding:0;margin-right:3px;border-radius:5px;background:none!important;box-shadow:none!important}
.chip.t0{background:#eef2f9;border-color:#b6c2d8}
.chip.t1{background:#fff0c4;border-color:#efc062}
.chip.t2{background:linear-gradient(120deg,#e3f0ff,#f3e6ff,#ffe6ee);border-color:#c9b0f0}
.chip.t3{background:linear-gradient(120deg,#ffe0ec,#fff0d6);border-color:#ff8fb0}
.chip .ico{background:#fff}
.chip small{font-size:11px;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.8);color:var(--muted)}
.ico.t0{background:#eef2f9}.ico.t3{background:linear-gradient(135deg,#ffe0ec,#fff0d6)}
.banner .ended{font-size:13px;color:var(--muted)}
.fuse-box{display:flex;flex-direction:column;gap:8px}
.fuse-card{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;border:3px solid transparent;background:linear-gradient(160deg,#ffe3ef,#fff0d6) padding-box,linear-gradient(120deg,#ff5f8a,#ffc94d,#ff5f8a) border-box;background-size:100% 100%,200% 100%;animation:prism 2.5s linear infinite;text-align:left;color:var(--ink);cursor:pointer;font:inherit;box-shadow:0 4px 0 #f3b2c4;transition:transform .2s,opacity .3s}
.fuse-card:hover{transform:translateY(-2px)}
.fuse-card:disabled{opacity:.3}
.fuse-card.chosen{opacity:1;transform:scale(1.05);box-shadow:0 0 0 4px #ff8fb0,0 0 36px rgba(255,111,145,.55)}
.fuse-mats{display:flex;align-items:center;justify-content:center;gap:6px}
.fuse-mats .ico{width:46px;height:46px;background:#fff}
.fuse-mats .ico.big{width:62px;height:62px;animation:wobble 2s ease-in-out infinite}
.fuse-mats b{font-family:var(--display);font-weight:var(--dw);font-size:22px;color:#ff5f8a}
.fuse-card .ct b{font-family:var(--display);font-weight:var(--dw);font-size:22px}
.rcp{display:flex;align-items:center;gap:5px;padding:8px 10px;border-radius:14px;border:0;background:linear-gradient(120deg,#fff0f5,#fff6e4);color:var(--ink);cursor:pointer;font:inherit;text-align:left}
.rcp .ico{width:34px;height:34px;background:#fff;padding:2px}
.rcp .op{font-family:var(--display);color:#ff5f8a}
.rcp b{margin-left:4px;font-family:var(--display);font-weight:var(--dw);font-size:16px}
/* 첫 화면 */
.rain{display:none;position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.ov.title .rain{display:block}
.ov .sheet{position:relative;z-index:1}
body.at-title .app{visibility:hidden}
.ov.title{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;place-items:start center}
.ov.title .sheet{background:none;box-shadow:none;padding:8px 0 20px;gap:14px;max-width:420px;animation:none}
.ov.title .eyebrow{font-family:var(--display);color:var(--verm);letter-spacing:.08em;font-size:13px}
.logo{margin:-4px 0 0;font-family:var(--display);font-weight:var(--dw);font-size:clamp(76px,24vw,108px);line-height:.95;letter-spacing:.01em;text-shadow:0 6px 0 #ffd9a8,0 12px 26px rgba(200,100,60,.22)}
.logo span{display:inline-block;animation:drop .7s cubic-bezier(.2,1.5,.4,1) backwards}
.logo span:nth-of-type(1){color:var(--verm)}.logo span:nth-of-type(2){color:#f2a93b;animation-delay:.08s}.logo span:nth-of-type(3){color:#3f9be0;animation-delay:.16s}
.logo.lg-en,.logo.lg-it{font-size:clamp(58px,17vw,80px);line-height:.92;letter-spacing:0}
.logo.lg-ja{font-size:clamp(40px,11.5vw,54px);line-height:1.08;letter-spacing:-.02em}
.logo.lg-zh{font-size:clamp(56px,16vw,78px);letter-spacing:.02em}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.tag{margin:0;padding:12px 16px;border-radius:18px;background:rgba(255,250,240,.86);font-size:15px;line-height:1.55;box-shadow:0 3px 0 rgba(226,185,138,.45)}
.tutcta{display:flex;align-items:center;justify-content:center;gap:8px}
.tutcta .ico{background:#fff}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:350px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:8px;padding:12px 12px 10px;border-radius:22px;background:rgba(255,255,255,.94);box-shadow:0 0 0 2.5px var(--rim),0 5px 0 2.5px var(--rim);min-width:0}
.mode-head{display:flex;align-items:center;gap:6px}
.mode-head .ico{width:38px;height:38px;padding:2px}
.mode-head h3{margin:0;flex:1;min-width:0;font-family:var(--display);font-weight:var(--dw);font-size:19px;line-height:1.1;overflow-wrap:anywhere}
.mode-head .termlink{padding:4px}
:root:not([data-lang="ko"]) .mode-head{display:grid;grid-template-columns:38px 1fr auto;grid-template-areas:"i . q" "n n n";row-gap:6px}
:root:not([data-lang="ko"]) .mode-head .ico{grid-area:i}
:root:not([data-lang="ko"]) .mode-head .termlink{grid-area:q;align-self:start}
:root:not([data-lang="ko"]) .mode-head h3{grid-area:n;font-size:18px;overflow-wrap:normal}
:root[data-lang="ja"] .mode-head h3{font-size:16.5px}
.mode p{margin:0;font-size:12.5px;line-height:1.45;flex:1}
.mode .primary{min-height:44px;font-size:17px;border-radius:14px}
.mode .save{font:var(--dw) 12px var(--display);color:var(--verm);text-align:center;margin-top:-2px}
.mode .linkbtn{align-self:center;font-size:12px;padding:2px 4px}
.minirow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:18px;border:0;background:rgba(255,250,240,.9);box-shadow:0 3px 0 var(--rim);color:var(--ink);font:var(--dw) 14px var(--display);cursor:pointer;transition:transform .12s}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--rim)}
.mini .ico{width:38px;height:38px;background:#fff}
.mini{min-width:0;flex-direction:row;justify-content:flex-start;gap:10px;padding:7px 12px 7px 8px;font-size:15px;line-height:1.15;text-align:left}
.mini .ico{width:34px;height:34px;flex:none}
/* 설정 */
.setgroup{display:flex;flex-direction:column;gap:8px;text-align:left}
.setlbl{margin:0;font:var(--dw) 15px var(--display);color:var(--muted)}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.langs.two{grid-template-columns:1fr 1fr}
.lang{min-height:46px;padding:6px 10px;border-radius:14px;border:2px solid var(--rim);background:var(--paper);color:var(--ink);font:16px var(--body);font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--rim);transition:transform .12s}
.lang:active{transform:translateY(2px);box-shadow:0 1px 0 var(--rim)}
.lang.on{background:#fff4d6;border-color:var(--gold);color:var(--verm);box-shadow:0 3px 0 #e9a92b}
.lang:lang(ko){font-family:"Gowun Dodum",sans-serif}.lang:lang(ja){font-family:"M PLUS Rounded 1c",sans-serif}.lang:lang(zh-Hans){font-family:"Noto Sans SC",sans-serif}.lang:lang(en),.lang:lang(it){font-family:"Nunito",sans-serif}
.records{margin:0;padding:10px 14px;border-radius:16px;background:rgba(255,250,240,.82);font-size:13px;color:var(--muted);line-height:1.7;text-align:center}
.records b{font-weight:var(--dw);font-family:var(--display);color:var(--ink)}
/* HUD 정리 */
.hud-top .icon-btn{width:36px;height:36px;border-radius:11px}
.hud-top{gap:6px}
/* 긴 화면: 세로를 꽉 채우기 — 보드는 가운데, 신명·증강 줄은 맨 아래 */
.app{min-height:100vh;min-height:100dvh}
@media (max-aspect-ratio:10/17) and (min-height:700px){
  .app{padding-inline:10px;padding-block:12px 18px;gap:12px;max-width:480px}
  .board-wrap{margin-block:auto}
  .hud{padding:14px 16px 12px;gap:11px;border-radius:24px}
  .hud-top .icon-btn{width:44px;height:44px;border-radius:13px}
  .icon-btn svg{width:22px;height:22px}
  .meter{height:11px}
  .timerow .meter{height:16px}
  .timerow b{font-size:26px}
  .timerow .lbl{font-size:14px}
  .fever{padding:13px 16px;border-radius:20px;gap:12px}
  .fever .meter{height:14px}
  .fever .termlink{font-size:18px}
  .fever .lbl{font-size:13px}
  .skill{padding:8px 14px 8px 8px;font-size:18px;border-radius:18px}
  .skill .ico.sm{width:40px;height:40px}
  .skill b{font-size:22px}
  .augs{gap:8px}
  .chip{padding:5px 12px 5px 5px;font-size:16px;border-radius:14px}
  .chip .ico{width:36px;height:36px;border-radius:10px}
  .augs .empty{font-size:14.5px;padding:12px 16px;border-radius:18px}
  .coach p{font-size:17px}
}

@media (max-aspect-ratio:10/17) and (min-height:700px) and (min-width:390px){
  .stage b{font-size:40px}
  .stage .lbl{font-size:17px}
  .augnext{font-size:12.5px}
  .scorebox b{font-size:36px}
  .scorebox .lbl{font-size:14px}
}

/* 시작 화면: made by */
.splash{position:fixed;inset:0;z-index:60;display:grid;place-content:center;justify-items:center;gap:14px;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);transition:opacity .5s ease,visibility .5s;cursor:pointer}
.splash.out{opacity:0;visibility:hidden}
.splash img{width:min(46vw,200px);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px #fff,0 0 0 10px var(--wood),0 16px 34px rgba(120,70,40,.28);animation:splashIn .8s cubic-bezier(.2,1.3,.4,1) backwards}
.splash p{margin:0;text-align:center;animation:rise .5s ease-out backwards}
.splash .by{margin-top:10px;font:600 15px "Fredoka","Nunito",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);animation-delay:.35s}
.splash .who{font:400 34px "Jua","Apple SD Gothic Neo",sans-serif;color:var(--ink);letter-spacing:.04em;animation-delay:.5s}
@keyframes splashIn{from{opacity:0;transform:scale(.6)}}

/* 앱 뒤로 가기: 종료 확인 */
.exitask{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:70;transform:translate(-50%,16px);width:max-content;max-width:calc(100% - 32px);padding:12px 22px;border-radius:18px;background:var(--paper);box-shadow:0 0 0 2.5px var(--rim),0 8px 20px rgba(140,90,50,.25);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s}
.exitask.on{opacity:1;transform:translate(-50%,0)}
.exitask b{display:block;font:var(--dw) 18px var(--display);color:var(--ink)}
.exitask span{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
/* 1분 모드 · 오늘의 미션 · 공유 카드 (v14) */
.quickwrap{position:relative}
.quickcta{display:flex;align-items:center;gap:12px;width:100%;padding:12px 18px 12px 12px;border:0;border-radius:24px;background:linear-gradient(115deg,#ff8a6b,#f2a93b 70%,#ffc94d);color:#fff;box-shadow:0 5px 0 #c7801f,0 10px 22px rgba(232,102,79,.25);cursor:pointer;text-align:left;font:inherit;transition:transform .12s,box-shadow .12s}
.quickcta:active{transform:translateY(3px);box-shadow:0 2px 0 #c7801f}
.quickcta .ico{width:54px;height:54px;border-radius:17px;background:#fff;padding:3px}
.quickcta .qt{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.quickcta b{font:var(--dw) 27px/1.05 var(--display);text-shadow:0 2px 0 rgba(160,80,20,.35)}
.quickcta small{font-size:13px;line-height:1.3;opacity:.96}
.quickcta .qplay{width:34px;height:34px;flex:none;padding:8px 6px 8px 10px;border-radius:50%;background:rgba(255,255,255,.28)}
.quickwrap .termlink{position:absolute;top:-7px;right:-5px;padding:0}
.quickwrap .termlink i{width:22px;height:22px;font-size:14px;box-shadow:0 0 0 2.5px #fff}
.missions{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:22px;background:rgba(255,255,255,.94);box-shadow:0 0 0 2.5px var(--rim),0 5px 0 2.5px var(--rim)}
.mhead{display:flex;align-items:center;gap:6px}
.mhead .ico{width:32px;height:32px;padding:1px;background:#fff6dc}
.mhead b{font:var(--dw) 18px var(--display)}
.mhead .termlink{padding:4px;margin-right:auto}
.mhead .mcount{font:var(--dw) 16px var(--display);color:var(--verm)}
.mrow{display:grid;grid-template-columns:1fr 58px 3.8em;align-items:center;gap:8px;font-size:13.5px;line-height:1.35}
.mrow .meter{height:8px}
.mrow .meter i{background:linear-gradient(90deg,#ffc35a,var(--gold))}
.mrow.done .mtxt{color:var(--jade);font-weight:700}
.mrow.done .meter i{background:var(--jade)}
.mrow .mnum{font:var(--dw) 12px var(--display);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mgift{margin:2px 0 0;display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.mgift .ico{width:24px;height:24px;padding:0;background:none;flex:none}
.mgift.ready{color:var(--verm);font-weight:700}
.mfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.mfoot .mreset b{font:var(--dw) 14px var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.mroll{display:inline-flex;align-items:center;gap:3px;height:34px;padding:0 10px 0 6px;border:2px solid var(--rim);border-radius:11px;background:#fff;color:var(--ink);font:var(--dw) 14px var(--display);cursor:pointer;flex:none;box-shadow:0 2px 0 var(--rim)}
.mroll:active{transform:translateY(2px);box-shadow:none}
.mroll .ico{width:22px;height:22px;padding:0;background:none}
.mroll b{color:var(--verm);margin-right:4px}
:root[data-lang="ko"] .sheet h2{word-break:keep-all}
.giftask{display:flex;justify-content:center;gap:12px}
.giftask .ico{width:72px;height:72px;border-radius:22px;background:#fff6dc;padding:6px;animation:wobble 2.4s ease-in-out infinite}
.giftask .ico:nth-child(2){background:linear-gradient(135deg,#dbeaff,#f1e3ff,#ffe1e6,#fff1cc);animation-delay:-1.2s}

  terms:{
    quickmode:['1분 모드', '딱 1분 동안 점수를 최대한 모으는 짧은 모드예요. 시작할 때 증강 3장 중 하나를 골라 그 판에서만 써요. 목표 점수는 없고, 장애물 없이 시작해요. 시간이 끝나면 바로 "한 판 더"로 다시 할 수 있어요. 최고 기록은 이 기기에 저장되고, 결과 카드로 친구에게 자랑할 수 있어요.'],
    mission:['오늘의 미션', '매일 한국 시간 0시에 새로 바뀌는 미션 4개예요. 스테이지 모드, 무한 모드, 1분 모드 어디서 해도 진행돼요. 미션 하나를 깰 때마다 별사탕 30개를 받고, 4개를 모두 깨면 색폭탄 1개와 무지개 구슬 1개를 받아요. 받은 색폭탄은 게임을 시작하기 직전에 뜨는 아이템 창에서 쓸 수 있어요. 하루 한 번, 무지개 구슬 1개로 미션 4개를 새로 받을 수 있어요.'],
    stagemode:['스테이지 모드', '정해진 시간 안에 목표 점수를 넘기면 다음 스테이지로 넘어가는 기본 모드예요. 첫 스테이지는 3분이고 스테이지를 깰 때마다 6초씩 줄어요(최소 1분 30초). 스테이지가 높을수록 판 모양이 어려워지고 구멍·돌·얼음이 나와요. 스테이지 1·3·6·10·15·21을 깨면 증강을 골라요. 시간이 끝날 때까지 목표를 못 채우면 게임 오버이고, 기록은 랭킹에 올릴 수 있어요. 맞출 곳이 없으면 판을 자동으로 섞어 줘요.'],
    endless:['무한 모드', '시간 제한 없이 천천히 즐기는 모드예요. 판은 처음 모양 그대로 이어지고, 점수가 2,000 · 5,000 · 9,000 · 14,000점…을 넘길 때마다 증강을 하나 골라 단계가 올라가요. 점수가 오를수록 판 상황을 보고 돌·얼음·구멍 같은 장애물이 그때그때 나타나요(빨리 올라갈수록 조금 더 많이). 대신 판을 섞어 주지 않아서, 맞출 수 있는 타일이 하나도 없으면 게임이 끝나요(별사탕이나 무지개 구슬로 부활할 수 있어요). 망치나 자유 교환이 남아 있으면 그 버튼을 깜빡여서 알려 줘요. 시간과 관련된 증강은 나오지 않고, 언제든 저장하고 이어 할 수 있어요.'],
    fever:['신명', '타일을 터뜨릴 때마다 보드 아래 신명 게이지가 차요. 가득 차면 7초 동안 신명 상태가 되어 모든 점수가 2배가 돼요. 신명 중에는 게이지가 다시 차지 않아요.'],
    combo:['콤보', '타일을 터뜨린 뒤 2.5초 안에 또 맞추면 콤보가 이어져요. 콤보가 하나 쌓일 때마다 점수가 5%씩 더 붙어요. (40콤보까지)'],
    cascade:['연쇄', '타일이 떨어지면서 저절로 또 맞으면 연쇄예요. 연쇄가 한 번 일어날 때마다 점수 배율이 0.5씩 올라가요.'],
    special:["특수 타일", "줄폭탄, 폭탄, 색폭탄을 함께 부르는 말이에요. 특수 타일끼리 자리를 바꾸면 효과가 합쳐져서 더 크게 터져요. 같은 종류끼리 바꾸면 '더블'이에요. 줄폭탄 둘은 두 줄 두께 십자로, 폭탄 둘은 5×5로 터지고, 색폭탄 둘은 판에서 가장 많은 두 색을 모두 지워요. 더블은 점수도 2배예요."],
    line:['줄폭탄', '4개를 한 줄로 맞추면 생겨요. 터지면 화살표 방향으로 한 줄을 통째로 지워요. 옆 타일과 자리만 바꿔도 바로 터져요.'],
    bomb:['폭탄', 'ㄱ자나 ㅗ자처럼 가로와 세로로 함께 맞추면 생겨요. 터지면 주변 3×3 칸을 한 번에 지워요.'],
    colorbomb:['색폭탄', '5개를 한 줄로 맞추면 생겨요. 아무 타일과 자리를 바꾸면, 그 타일과 같은 색을 판에서 모두 지워요.'],

    endless:['Endless Mode', "A relaxed mode with no time limit. The board keeps its shape from start to finish. Each time your score passes 2,000 · 5,000 · 9,000 · 14,000…, you pick an augment and move up a wave. As your score climbs, obstacles like stones, ice, and holes pop up on the spot depending on how the board looks (a few more if you're climbing fast). The board never shuffles on its own, so if no matches are possible, the game ends, though you can revive with Star Candy or Rainbow Marbles. If you still have Hammer or Free Swap uses left, that button flashes to remind you. Time-related augments don't appear, and you can save and continue anytime."],

    line:['Line Bomb', 'Made by matching 4 in a row. It clears an entire line in the direction of its arrows. It goes off just by swapping it with a neighboring tile.'],
    bomb:['Bomb', 'Made by matching across and down at once, in an L or T shape. It clears the 3×3 area around it.'],
    colorbomb:['Color Bomb', 'Made by matching 5 in a row. Swap it with any tile to clear every tile of that color from the board.'],
    gold:['Gold Leaf Tile', 'A tile with a gold rim. Clearing it scores 5 times the points of a normal tile.'],

    design:['Board Design', "Boards aren't pre-made. A new one is designed every time a stage starts. Higher stages have more holes, plus stones and ice. You can see the current board design when the stage starts and on the pause screen."],

    dur:['Duration', 'Some augments only last for a set number of stages. The count drops by 1 every time you clear a stage, and the augment disappears at 0. Your augment list shows how many stages are left.'],
    fuse:['Fusion', "If you own a matching pair of augments, you can choose 'Fuse' the next time you pick an augment. Fusing creates a Legendary augment. The ingredients keep their effects, and their duration limits are removed."],

    hammer:['Hammer', "Pick the 'Little Hammer' augment to get a Hammer button below the board. Tap the button, then tap a tile to smash it."],

const KST = 9 * 3600e3, DAY = 864e5;

let MIS = null;

    return MIS;

const RANK = {db:null, uid:null, canWrite:null, list:[], ready:false, failed:false, submitted:false, view:null, pull:null};
/* ---------- 공개 웹사이트용 랭킹 (v27): Firebase Firestore를 REST로 직접 부른다 ----------
   Claude 화면에서는 window.claude의 db를 쓰고, 웹사이트에서는 index.html 머리말의 window.JKP_FIREBASE = {apiKey, projectId}가 있을 때 이것을 쓴다.
   기존 랭킹 코드가 쓰던 모양(collection().orderBy().limit().onSnapshot, doc().get/set/update)을 그대로 흉내 낸다.

function fireDB(cfg) {

  const encF = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, enc(v)]));
  const dec = v => 'stringValue' in v ? v.stringValue : 'integerValue' in v ? +v.integerValue : 'doubleValue' in v ? v.doubleValue
    : 'arrayValue' in v ? (v.arrayValue.values || []).map(dec) : 'mapValue' in v ? decF(v.mapValue.fields || {}) : 'booleanValue' in v ? v.booleanValue : null;

    if (AUTH.tok && Date.now() < AUTH.exp - 60e3) return AUTH.tok;
    const saved = store.get('fb', null);
    let r;
    if (saved && saved.rt) {
      r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${cfg.apiKey}`, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(saved.rt)});
      if (r.ok) { const j = await r.json(); AUTH.tok = j.id_token; AUTH.exp = Date.now() + (+j.expires_in) * 1000; AUTH.uid = j.user_id; store.set('fb', {rt:j.refresh_token, uid:j.user_id}); return AUTH.tok; }
    }

    return AUTH.tok;

    async get() {
      const r = await fetch(`${BASE}/${path}`, {headers:{Authorization:'Bearer ' + await token()}});
      if (r.status === 404) return {exists:false, data:() => undefined};
      if (!r.ok) await fail(r);

    },
    async set(obj) { const r = await fetch(`${BASE}/${path}`, {method:'PATCH', headers:{Authorization:'Bearer ' + await token(), 'Content-Type':'application/json'}, body:JSON.stringify({fields:encF(obj)})}); if (!r.ok) await fail(r); },
    async update(obj) {

    },
  });

    uid:async () => { await token(); return AUTH.uid; },
    doc:docRef,
    collection:name => {
      const q = {from:[{collectionId:name}]};
      const api = {
        orderBy(f, dir) { q.orderBy = [{field:{fieldPath:f}, direction:dir === 'desc' ? 'DESCENDING' : 'ASCENDING'}]; return api; },
        limit(n) { q.limit = n; return api; },

          let stop = false;
          const pull = async () => {
            if (stop || document.hidden) return;
            try {
              const r = await fetch(`${BASE}:runQuery`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({structuredQuery:q})});
              if (!r.ok) await fail(r);
              const rows = (await r.json()).filter(x => x.document).map(x => ({id:x.document.name.split('/').pop(), data:() => decF(x.document.fields || {})}));

        },

    },

}
(async () => {

async function openShare(info, back) {
  info.augs = info.augs || S.augs.filter(a => !a.fused);
  const text = T('shareText', info.mode, fmt(info.score));
  const native = !!(window.AndroidBridge && window.AndroidBridge.shareImage), web = !!navigator.share && !window.claude;   // Claude 화면 안에서는 웹 공유가 막혀 있어 저장만 보여 준다
  showOv(`
    <p class="eyebrow">${T('shareEyebrow')}</p>
    <h2>${T('shareTitle')}</h2>
    <div class="shareimg" id="shareImg"><p class="best">${T('shareMaking')}</p></div>
    <div class="btnrow">${native || web ? `<button class="primary" id="shareGo" disabled>${T('shareBtn')}</button>` : ''}
      ${native ? '' : `<button class="ghost" id="shareDl" disabled>${T('saveImg')}</button>`}
      <button class="ghost" id="shareBack">${T('back')}</button></div>
    <p class="best" id="shareNote">${native ? '' : T('shareHint')}</p>`);
  $('shareBack').onclick = back;
  // Claude 화면 안에서는 downloads 기능으로, 일반 브라우저에서는 링크로 저장
  const dlP = (!native && window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  const box = $('shareImg');
  let c;
  try { c = await makeCard(info); } catch (e) { box.innerHTML = ''; return; }
  if (!box.isConnected) return;
  const url = c.toDataURL('image/png');
  box.innerHTML = `<img class="sharecard" alt="${esc(text)}" src="${url}">`;
  if ($('shareDl')) {
    $('shareDl').disabled = false;
    $('shareDl').onclick = async () => {
      SFX.pick();
      const dl = await dlP;
      if (dl) { c.toBlob(b => { dl.save({filename:'augment-pop.png', data:b}).catch(() => {}); }, 'image/png'); return; }
      const a = document.createElement('a'); a.href = url; a.download = 'augment-pop.png'; document.body.appendChild(a); a.click(); a.remove();
    };
  }
  const go = $('shareGo'); if (!go) return;
  go.disabled = false;
  go.onclick = () => {
    SFX.pick();
    if (native) {
      let ok = false;
      try { ok = window.AndroidBridge.shareImage(c.toDataURL('image/jpeg', .92).split(',')[1], text); } catch (e) {}
      $('shareNote').textContent = ok ? T('shareSaved') : '';
      return;
    }
    c.toBlob(b => {
      try {
        const f = new File([b], 'augment-pop.png', {type:'image/png'});

const ON_WEB = !window.AndroidBridge && !window.claude && window.top === window;

  const BACK_BTNS = ['popClose', 'shareBack', 'shopBack', 'bagBack', 'achBack', 'rankBack', 'glBack', 'setDone'];
  let armed = 0;

      const b = BACK_BTNS.map(id => $(id)).find(x => x && sheet.contains(x));

  document.addEventListener('contextmenu', e => { if (!e.target.closest('input,textarea')) e.preventDefault(); });

  let installEvt = null;
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

}
